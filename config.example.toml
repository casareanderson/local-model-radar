# local-model-radar config. Everything site-specific; secrets live in the
# environment (LOCALRADAR_DISCORD_WEBHOOK), never here.

state_dir = "~/.local/state/local-model-radar"

[ollama]
base_url = "http://192.168.8.152:11434"

[hardware]
# RTX 2060 = 6144 MiB. Leave headroom for KV cache and ComfyUI --lowvram.
vram_budget_mib = 5500
min_free_disk_mib = 4096

[radar]
min_ctx = 65536
max_probes_per_run = 3
adopt = false
adopt_targets = []          # e.g. ["writer", "scout"] -- NEVER "global"/CoS
adopt_confirms = 3
adopt_confirm_gap_s = 8
adopt_tokens_per_sec_floor = 8.0
adopt_speed_factor = 0.7
adopt_cooldown_days = 7
blocklist = ["qwen2.5:14b", "nemotron-3.5-lightning:30b"]  # known CPU-only
candidates = []             # explicit tags to always watch

[canary]
targets = []                # empty = every profile the adapter sees
fails_before_failover = 2
ladder = []                 # ordered smaller models, e.g. ["llama3.2:3b"]
[canary.local]
model = "llama3.2:3b"

[tidy]
# Models used by NON-Hermes systems (Honcho, embeddings, qwen-code). These are
# NOT in any Hermes profile, so a tidy without this list would delete them and
# break those systems. Add every external consumer's model here.
keep = ["mistral-nemo", "nomic-embed-text", "qwen2.5-coder"]

[adapter]
name = "hermes"
home = "~/.hermes"

[notify]
discord_webhook_env = "LOCALRADAR_DISCORD_WEBHOOK"
